# Upload eStatement maksimal 10 MB; sedikit di atasnya, sejajar dengan BODY_SIZE_LIMIT=11M di app.
client_max_body_size 11m;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP dasar (font data: dari CSS bundel; iframe preview PDF satu origin); SvelteKit memakai skrip/gaya inline, jadi 'unsafe-inline' dipertahankan.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
