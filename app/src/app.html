<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pembukuan Online</title>
		<meta name="description" content="Pembukuan Online — Pembukuan Keuangan" />
		<meta name="theme-color" content="#6bad40" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Pasang tema sebelum halaman digambar (default gelap) agar tidak berkedip. Logika sama dengan src/lib/theme.ts. -->
		<script>
			(function () {
				var m = 'dark';
				try {
					var v = localStorage.getItem('jk-theme');
					if (v === 'dark' || v === 'light' || v === 'system') m = v;
				} catch (e) {}
				var d = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				var r = document.documentElement;
				if (d) r.classList.add('dark'); else r.classList.remove('dark');
				r.style.colorScheme = d ? 'dark' : 'light';
				r.dataset.theme = m;
				try { if (localStorage.getItem('jk-sidebar') === 'collapsed') r.dataset.sidebar = 'collapsed'; } catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
